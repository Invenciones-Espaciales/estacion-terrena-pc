serial:
  port: "/dev/ttyACM0"
  baudrate: 115200
  reconnect_delay: 3

websocket:
  host: "0.0.0.0"
  port: 8000

storage:
  database: "data/telemetry.db"
  csv: "data/telemetry.csv"
  database_enabled: true       # Master switch for SQLite database persistence
  csv_enabled: true            # Master switch for CSV file logging
  disable_db_in_demo: true     # Automatically suppress SQLite writes in demo mode (RPi SD card protection)
  disable_csv_in_demo: true    # Automatically suppress CSV writes in demo mode

demo:
  enabled: false               # If true, runs built-in synthetic telemetry generator at 10 Hz
  save_to_db: false            # Keep false to prevent flash wear on Raspberry Pi SD card during simulations
  save_to_csv: false           # Keep false to avoid disk writes in demo mode

gonogo:
  altitude_tol_m: 5.0
  accel_xy_tol_g: 0.1
  accel_z_nominal_g: 1.0
  accel_z_tol_g: 0.15
  gps_radius_m: 5.0
  weather_limits:
    max_wind_speed_ms: 10.0
    max_cloud_cover_pct: 75.0
    min_visibility_km: 5.0
  manual_checklist:
    - id: "ant_gs"
      item: "Antena de GS instalada"
      responsible: "Comunicaciones"
    - id: "ant_rocket"
      item: "Antena del cohete"
      responsible: "Mecánica"
    - id: "rocket_secured"
      item: "Cohete asegurado"
      responsible: "Mecánica"
    - id: "area_clear"
      item: "Área despejada"
      responsible: "Operaciones"
    - id: "rec_ready"
      item: "Recuperación lista"
      responsible: "Recuperación"
    - id: "weather_check"
      item: "Meteorología (<15 km/h)"
      responsible: "Control de vuelo"
    - id: "wiring_check"
      item: "Cableado e ignitores"
      responsible: "Mecánica"

charts:
  scaling_mode: "ratchet" # "ratchet" (recommended: envelope with non-shrinking expansion), "auto", or "fixed"
  altitude:
    pad_max_m: 50.0 # Maximum visible scale on launchpad (STANDBY phase) to avoid noise amplification
    expected_apogee_m: 1500.0 # Planned apogee ceiling for flight envelope
    step_m: 500.0 # Incremental step when expanding above expected apogee
  acceleration:
    min_g: -2.0 # Nominal negative G floor (e.g. atmospheric drag / separation)
    max_g: 12.0 # Nominal axial positive G ceiling (boost / chute opening shock)
  velocity:
    min_vz_ms: -40.0 # Nominal descent velocity floor
    max_vz_ms: 160.0 # Nominal ascent velocity ceiling
    step_ms: 50.0 # Expansion step for velocity
